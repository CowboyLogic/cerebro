name: CI

on:
  push:
    branches-ignore:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout cerebro-schema
        uses: actions/checkout@v6
        with:
          repository: CowboyLogic/cerebro-schema
          path: cerebro-schema
          token: ${{ secrets.CEREBRO_SCHEMA_READ_TOKEN }}

      - name: Checkout cerebro
        uses: actions/checkout@v6
        with:
          path: cerebro

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: cerebro/package-lock.json

      - name: Install cerebro-schema dependencies
        working-directory: cerebro-schema
        run: npm ci

      - name: Install dependencies
        working-directory: cerebro
        run: npm ci

      - name: Build
        working-directory: cerebro
        run: npm run build

      - name: Test
        working-directory: cerebro
        run: npm test
        continue-on-error: true

  docs:
    name: Docs build (strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cerebro
        uses: actions/checkout@v6
        with:
          path: cerebro

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install MkDocs dependencies
        run: pip install mkdocs-material mkdocs-callouts

      - name: Build docs
        working-directory: cerebro
        run: mkdocs build --strict

  ci:
    name: Build & Test
    needs: [build, docs]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: All matrix legs passed
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "Matrix result: ${{ needs.build.result }}"
            exit 1
          fi
          if [ "${{ needs.docs.result }}" != "success" ]; then
            echo "Docs result: ${{ needs.docs.result }}"
            exit 1
          fi
